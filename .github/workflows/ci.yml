name: RAG System CI

on:
  push:
    branches: [ "**" ]  # Run on all branches
  pull_request:
    branches: [ main, master, SantoshEdulapalle ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test-rag-system:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
        
    - name: Verify test files exist
      run: |
        echo "🔍 Checking available test files..."
        ls -la test_*.py || echo "No test files found"
        
        if [ ! -f "test_rag_backend.py" ]; then
          echo "❌ test_rag_backend.py file not found"
          exit 1
        fi
        echo "✅ test_rag_backend.py file found"
        
    - name: Run comprehensive test suite
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        MILVUS_URI: ${{ secrets.MILVUS_URI }}
        MILVUS_TOKEN: ${{ secrets.MILVUS_TOKEN }}
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        ENABLE_RERANKING: "true"
        RERANKING_MODEL: "o3"
      run: |
        echo "🎯 Running COMPREHENSIVE TEST SUITE for AI/ML Educational Platform"
        echo "=" * 80
        
        # Run quick essential tests first for fast feedback
        echo "🚀 Running quick tests (auth, rag, security)..."
        if python run_comprehensive_tests.py --quick; then
          echo "✅ Quick tests passed, running full suite..."
          
          # Run full comprehensive test suite
          echo "🧪 Running complete test suite..."
          python run_comprehensive_tests.py
        else
          echo "❌ Quick tests failed, skipping full suite"
          exit 1
        fi
        
    - name: Test individual test suites (for debugging)
      if: failure() # Only run if main tests failed
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        MILVUS_URI: ${{ secrets.MILVUS_URI }}
        MILVUS_TOKEN: ${{ secrets.MILVUS_TOKEN }}
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      run: |
        echo "🔍 Running individual test suites for debugging..."
        
        # Test each suite individually to identify failures
        for suite in auth rag security features session_quiz_fixes; do
          echo "Testing $suite suite..."
          if python run_comprehensive_tests.py --suite $suite; then
            echo "✅ $suite suite passed"
          else
            echo "❌ $suite suite failed"
          fi
          echo "---"
        done
        
    - name: Test API endpoints
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        MILVUS_URI: ${{ secrets.MILVUS_URI }}
        MILVUS_TOKEN: ${{ secrets.MILVUS_TOKEN }}
      run: |
        echo "Testing API endpoints..."
        python -c "
        import asyncio
        import sys
        sys.path.insert(0, '.')
        from app import app
        from fastapi.testclient import TestClient
        
        client = TestClient(app)
        
        # Test chat endpoint (core functionality)
        response = client.get('/api/health')
        print(f'Chat endpoint status: {response.status_code}')
        if response.status_code == 200:
            print('✅ Core API endpoints accessible')
        
        # Test health endpoint
        response = client.get('/api/health')
        print(f'Health status: {response.status_code}')
        if response.status_code == 200:
            health = response.json()
            print(f'System status: {health.get(\"status\")}')
            print(f'Zilliz connected: {health.get(\"zilliz_connected\")}')
        "
