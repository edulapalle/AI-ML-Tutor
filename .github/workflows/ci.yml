name: RAG System CI

on:
  push:
    branches: [ "**" ]  # Run on all branches
  pull_request:
    branches: [ main, master, SantoshEdulapalle ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test-rag-system:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx
        
    - name: Verify test files exist
      run: |
        echo "🔍 Checking available test files..."
        ls -la test_*.py || echo "No test files found"
        
        if [ ! -f "test_rag_backend.py" ]; then
          echo "❌ test_rag_backend.py file not found"
          exit 1
        fi
        echo "✅ test_rag_backend.py file found"
        
    - name: Run comprehensive test suite
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        MILVUS_URI: ${{ secrets.MILVUS_URI }}
        MILVUS_TOKEN: ${{ secrets.MILVUS_TOKEN }}
        ENABLE_RERANKING: "true"
        RERANKING_MODEL: "o3"
      run: |
        echo "🧪 Running RAG backend tests..."
        if ! python test_rag_backend.py; then
          echo "❌ RAG backend tests failed"
          exit 1
        fi
        echo "✅ RAG backend tests passed"
        
        echo "🧪 Running integration tests..."
        if ! python test_integration_comprehensive.py; then
          echo "❌ Integration tests failed"
          exit 1
        fi
        echo "✅ Integration tests passed"
        
        echo "🧪 Running data quality tests..."
        if ! python test_data_quality.py; then
          echo "❌ Data quality tests failed"
          exit 1
        fi
        echo "✅ Data quality tests passed"
        
    - name: Test API endpoints
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        MILVUS_URI: ${{ secrets.MILVUS_URI }}
        MILVUS_TOKEN: ${{ secrets.MILVUS_TOKEN }}
      run: |
        echo "Testing API endpoints..."
        python -c "
        import asyncio
        import sys
        sys.path.insert(0, '.')
        from app import app
        from fastapi.testclient import TestClient
        
        client = TestClient(app)
        
        # Test chat endpoint (core functionality)
        response = client.get('/api/health')
        print(f'Chat endpoint status: {response.status_code}')
        if response.status_code == 200:
            print('✅ Core API endpoints accessible')
        
        # Test health endpoint
        response = client.get('/api/health')
        print(f'Health status: {response.status_code}')
        if response.status_code == 200:
            health = response.json()
            print(f'System status: {health.get(\"status\")}')
            print(f'Zilliz connected: {health.get(\"zilliz_connected\")}')
        "
