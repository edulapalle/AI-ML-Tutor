[build]
builder = "nixpacks"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"

[[services]]
name = "ai-learning-platform"

[services.variables]
PORT = "8000"
PYTHONPATH = "/app"

[services.healthcheck]
path = "/health"
interval = 30
timeout = 5
retries = 3
